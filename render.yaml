services:
  - type: web
    name: star-home-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --prefix apps/web --omit=dev --ignore-scripts && npm ci --prefix apps/api --include=dev && npm run prisma --prefix apps/api
    startCommand: cd apps/api && ./node_modules/.bin/tsx src/main.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: STAR_HOME_VAPID_SUBJECT
        value: https://star-home.space
      - key: DATABASE_URL
        sync: false
      - key: STAR_HOME_INTERNAL_SECRET
        sync: false
      - key: STAR_HOME_SESSION_SECRET
        sync: false
      - key: STAR_HOME_VAPID_PUBLIC
        sync: false
      - key: STAR_HOME_VAPID_PRIVATE
        sync: false
