<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STAR HOME</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f4f0; color: #1a1a1a; font-family: Inter, system-ui, sans-serif; }
      main { width: min(420px, calc(100% - 48px)); text-align: center; }
      p { letter-spacing: 0.22em; font-size: 15px; }
      h1 { margin: 24px 0 0; font-size: 28px; font-weight: 500; letter-spacing: -0.03em; }
      .muted { margin-top: 12px; color: #6f6b64; letter-spacing: 0; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <p>STAR HOME</p>
      <h1 id="place">Нет сети</h1>
      <p class="muted" id="detail">Последнее подтверждённое состояние дома появится здесь. Ворота, оплата, пропуск и охрана ждут ответа сервера.</p>
    </main>
    <script>
      caches.open("star-home-state").then((cache) => cache.match("/confirmed-home")).then((response) => response && response.json()).then((state) => {
        if (!state) return;
        document.getElementById("place").textContent = state.place || "Нет сети";
        const parts = [state.mode, state.temperature].filter(Boolean);
        if (parts.length) document.getElementById("detail").textContent = parts.join(" · ");
      });
    </script>
  </body>
</html>
